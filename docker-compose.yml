services:
  postgres:
    image: postgres:17-alpine
    container_name: gtm-os-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gtm_os
      POSTGRES_USER: gtm_os
      POSTGRES_PASSWORD: gtm_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gtm_os -d gtm_os"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data: